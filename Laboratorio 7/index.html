<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio Semana 11</title>
  <link rel="stylesheet" href="estilos.css">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

</head>
<body class="container mt-4">

  <h2>Formulario de prueba</h2>

  <form id="miFormulario">
    <div class="form-group">
<label>Nombre:
      <input type="text" id="nombre" class="form-control"/>
    </label>
    </div>
    
<div class="form-group">
<label>Apellido:
      <input type="text" id="apellido" class="form-control" />
    </label>
</div>

    <button type="button" id="validarBtn" class="btn btn-primary">Validar</button>
  </form>

  <p id="mensaje"></p>

  <hr>

  <div id="bloqueTexto" class="caja">
    Este texto cambiará de color dinámicamente.
  </div>

  <button id="agregarClase" class="btn btn-success">Agregar clase</button>
  <button id="quitarClase" class="btn btn-secondary">Quitar clase</button>

  <hr>

  <button id="mostrarOcultar" class="btn btn-warning">Mostrar/Ocultar Elemento</button>
  <div id="elementoOculto" style="display:none;" class="alert alert-info mt-3">Elemento oculto que puede mostrarse</div>
<div style="text-align: center; margin-top: 20px;">
 
  <h3 id="contador">0</h3>
  <button onclick="modificarContador(1)">Incrementar</button>
  <button onclick="modificarContador(-1)">Disminuir</button>
</div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
